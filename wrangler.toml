# Cloudflare Workers + static assets — required so CI `npx wrangler deploy` succeeds.
# (Dashboard is locked to that command; `wrangler pages deploy` is not used.)
name = "rustcheats-io"
main = "workers/site.js"
compatibility_date = "2026-09-12"

# Workers Builds: set deploy command to `npm run deploy:cloudflare`.
# Wrangler runs `npm run build` once via [build] below (includes SEO verify).
[build]
command = "npm run build"

# Recreate DNS/SSL for rustcheats.io + www (fixes NXDOMAIN / Google HTTP 522).
[[routes]]
pattern = "rustcheats.io"
custom_domain = true

[[routes]]
pattern = "www.rustcheats.io"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "drop-trailing-slash"
# All requests through Worker so www/HTTP redirects apply to sitemaps too.
# Worker fetches via https://assets.local (never the custom domain) to avoid 522.
run_worker_first = true
